name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # El enunciado pide que el pipeline FALLE si aparece un secret hardcodeado.
  # Este job corre primero y bloquea todo lo demas.
  secretos:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita el historial completo, no solo el ultimo commit

      - name: Buscar secretos en el repo y su historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: pytest
    needs: secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pruebas
        run: pytest -v

  imagen:
    name: build docker
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen del nodo D
        run: docker build -t tp1-nodo-d:${{ github.sha }} .
